schema: spec-driven

context: |
  Language: zh-CN
  All artifacts must be written in zh-CN.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  本项目是 DeepSeek Harness 的 TUI 插件；遵循 AGENTS.md、docs/contributing.md 与 ADAPTER.md。
  上游域服务由 DSH 拥有；官方包的源码 import 仅允许出现在 src/dsh-adapter/。
  提案中的计划能力不等于已实现；未完成任务必须保留未勾选状态。
  用户可见行为落地时同步中英文文档；纯提案文档不要求重建 TypeScript。
